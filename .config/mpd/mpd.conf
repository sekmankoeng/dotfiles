music_directory         "~/Music"
playlist_directory      "~/.config/mpd/playlists"
#db_file                 "~/.config/mpd/tag_cache"
log_file                "~/.config/mpd/mpd.log"
#pid_file                "~/.config/mpd/pid"
#state_file              "~/.config/mpd/state"
#sticker_file            "~/.config/mpd/sticker.sql"

bind_to_address         "127.0.0.1"
port                    "6600"

# ===== PipeWire 音频输出（Debian13 默认音频后端）=====
audio_output {
        type        "pipewire"
        name        "My PipeWire Feed"
}

audio_output {
        type        "fifo"
        name        "My Fifo Feed"
        path        "/tmp/mpd.fifo"
        format      "44100:16:2"
}

audio_output {
        type        "fifo"
        name        "My Cava Feed"
        path        "/tmp/mpd.cava.fifo"
        format      "44100:16:2"
}
